<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>HappyRO image composition</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent}img{display:block;width:100%;height:100%;object-fit:contain}
.hero{position:relative;width:1600px;height:1000px;overflow:hidden;background:transparent}
.monitor{position:absolute;left:420px;top:35px;width:992px;height:776px;padding:14px 14px 38px;background:#25272a;border-radius:19px;box-shadow:0 12px 28px #141b2426;border:2px solid #5b6066}
.monitor img{height:720px;border-radius:5px}.monitor:after{content:"";position:absolute;width:7px;height:7px;background:#777d82;border-radius:50%;bottom:14px;left:50%}
.stand{position:absolute;left:846px;top:806px;width:140px;height:94px;background:#a6adb3;clip-path:polygon(15% 0,85% 0,100% 100%,0 100%)}
.foot{position:absolute;left:771px;top:889px;width:290px;height:16px;background:#c1c7cc;border-radius:50% 50% 6px 6px;box-shadow:0 6px 10px #141b2420}
.tablet{position:absolute;left:36px;top:440px;width:696px;height:532px;padding:14px 18px;border:2px solid #6b7076;background:#24272a;border-radius:26px;box-shadow:0 12px 28px #141b2430}
.tablet img{border-radius:10px}.phone{position:absolute;left:1252px;top:358px;width:300px;height:600px;padding:10px;border:3px solid #626970;background:#202428;border-radius:35px;box-shadow:0 12px 28px #141b2430}
.phone img{border-radius:23px}.phone:after{content:"";position:absolute;bottom:15px;left:110px;width:76px;height:4px;border-radius:4px;background:#fff9}
.skills{width:1600px;height:865px;background:transparent;display:flex;align-items:center;gap:30px;padding:20px 30px}
.skills .wide{width:1100px;height:825px;border:8px solid #282c30;border-radius:18px;overflow:hidden}.skills .tall{width:410px;height:820px;border:8px solid #282c30;border-radius:22px;overflow:hidden}
</style>
<div class="hero" id="hero">
 <div class="stand"></div><div class="foot"></div>
 <div class="monitor"><img src="desktop.png"></div>
 <div class="tablet"><img src="tablet.png"></div>
 <div class="phone"><img src="phone.png"></div>
</div>
<div class="skills" id="skills"><div class="wide"><img src="tablet-skills.png"></div><div class="tall"><img src="phone-skills.png"></div></div>
</html>
